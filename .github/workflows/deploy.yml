name: deploy
on:
  push:
    branches: [claude/overnight-revenue-product-xpf7xr]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: node --test tests/obbba.test.mjs tests/form1099.test.mjs tests/ot_splitter.test.mjs
      - name: Publish site/ to gh-pages
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
